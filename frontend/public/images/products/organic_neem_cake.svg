<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad3)" rx="24"/>

  <!-- Sack with Shadow -->
  <g filter="url(#shadow3)">
    <ellipse cx="300" cy="525" rx="160" ry="24" fill="#0f172a" opacity="0.2"/>

    <!-- Jute / Kraft Sack Body -->
    <path d="M180,160 Q300,140 420,160 L445,470 Q445,510 400,515 L200,515 Q155,510 155,470 Z" fill="url(#sackGrad)"/>
    
    <!-- Top Stitched Seal -->
    <rect x="175" y="150" width="250" height="22" fill="#78350f" rx="4"/>
    <line x1="185" y1="161" x2="415" y2="161" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,6"/>

    <!-- Center Bio Label -->
    <rect x="195" y="200" width="210" height="280" rx="12" fill="#ffffff"/>

    <rect x="195" y="200" width="210" height="50" rx="12" fill="#15803d"/>
    <text x="300" y="232" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">100% ORGANIC</text>

    <!-- Product Title -->
    <text x="300" y="280" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#78350f" text-anchor="middle">PURE NEEM CAKE</text>
    <text x="300" y="302" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#15803d" text-anchor="middle">COLD-PRESSED BIO-FERTILIZER</text>

    <!-- Neem Leaf Emblem -->
    <circle cx="300" cy="345" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="300" y="357" font-size="28" text-anchor="middle">🌿</text>

    <text x="300" y="398" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="#0f172a" text-anchor="middle">Dual Action: Soil Food + Anti-Nematode</text>
    <text x="300" y="412" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b" text-anchor="middle">Rich in Azadirachtin &amp; Micro-Nutrients</text>

    <!-- Heavy Bag Stamp -->
    <rect x="230" y="428" width="140" height="34" rx="17" fill="#b45309"/>
    <text x="300" y="450" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">25 KG HEAVY SACK</text>
  </g>
</svg>