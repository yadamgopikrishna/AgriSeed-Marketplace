<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad2)" rx="24"/>
  <circle cx="300" cy="300" r="230" fill="#3b82f6" opacity="0.08"/>

  <!-- Pouch Stand-up with Shadow -->
  <g filter="url(#shadow2)">
    <ellipse cx="300" cy="525" rx="150" ry="24" fill="#0f172a" opacity="0.18"/>

    <!-- Pouch Body -->
    <path d="M190,130 Q300,110 410,130 L430,470 Q430,500 390,505 L210,505 Q170,500 170,470 Z" fill="url(#pouchGrad)"/>
    
    <!-- Top Heat Seal Texture -->
    <rect x="190" y="125" width="220" height="25" fill="#1e3a8a" rx="4"/>
    <line x1="200" y1="137" x2="400" y2="137" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>
    <ellipse cx="300" cy="137" rx="10" ry="4" fill="#0f172a" opacity="0.3"/>

    <!-- Pouch Center Panel -->
    <rect x="205" y="170" width="190" height="300" rx="12" fill="#ffffff"/>

    <!-- Brand Header -->
    <rect x="205" y="170" width="190" height="50" rx="12" fill="#1e3a8a"/>
    <text x="300" y="202" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">IFFCO</text>

    <!-- NPK Ratio High Visibility -->
    <text x="300" y="255" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#1e40af" text-anchor="middle">NPK 19:19:19</text>
    <text x="300" y="278" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#0284c7" text-anchor="middle">100% WATER SOLUBLE</text>

    <!-- 3 Nutrient Circles -->
    <g transform="translate(230, 295)">
      <circle cx="20" cy="20" r="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#b91c1c" text-anchor="middle">N:19</text>
      
      <circle cx="70" cy="20" r="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="70" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#b45309" text-anchor="middle">P:19</text>

      <circle cx="120" cy="20" r="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="120" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#15803d" text-anchor="middle">K:19</text>
    </g>

    <!-- Drip Fertigation Badge -->
    <rect x="225" y="360" width="150" height="40" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="300" y="380" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0369a1" text-anchor="middle">💧 DRIP &amp; FOLIAR GRADE</text>
    <text x="300" y="394" font-family="Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b" text-anchor="middle">Zero Residue / 100% Uptake</text>

    <!-- Weight Tag -->
    <rect x="235" y="420" width="130" height="34" rx="17" fill="#f59e0b"/>
    <text x="300" y="442" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">1 KG NET POUCH</text>
  </g>
</svg>