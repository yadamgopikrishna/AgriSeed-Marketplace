<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDrill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadowDrill" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGradDrill)" rx="24"/>

  <g filter="url(#shadowDrill)">
    <ellipse cx="300" cy="520" rx="180" ry="24" fill="#0f172a" opacity="0.2"/>

    <line x1="160" y1="180" x2="280" y2="380" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <line x1="200" y1="180" x2="320" y2="380" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <rect x="150" y="160" width="60" height="24" rx="6" fill="#ea580c"/>

    <polygon points="260,260 360,260 340,360 280,360" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <polygon points="340,260 420,260 400,360 350,360" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>

    <text x="310" y="315" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">SEED</text>
    <text x="380" y="315" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">FERT</text>

    <circle cx="240" cy="460" r="50" fill="#0f172a" stroke="#cbd5e1" stroke-width="8"/>
    <circle cx="240" cy="460" r="20" fill="#dc2626"/>

    <circle cx="420" cy="470" r="38" fill="#0f172a" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="420" cy="470" r="16" fill="#2563eb"/>

    <line x1="240" y1="460" x2="420" y2="470" stroke="#ea580c" stroke-width="10"/>

    <g transform="translate(150, 70)">
      <rect width="300" height="44" rx="22" fill="#0f172a"/>
      <text x="150" y="28" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">⚙️ SEED-CUM-FERTILIZER DRILL</text>
    </g>
  </g>
</svg>