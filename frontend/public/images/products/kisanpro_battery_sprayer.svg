    <text x="300" y="394" font-family="Arial, sans-serif" font-weight="600" font-size="8" fill="#64748b" text-anchor="middle">Stainless Steel Telescopic Lance</text>

    <path d="M390,430 Q440,430 450,350 L450,160" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none"/>
