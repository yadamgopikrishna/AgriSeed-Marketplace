    <rect x="260" y="130" width="80" height="35" rx="8" fill="#facc15" stroke="#eab308" stroke-width="2"/>

    <rect x="220" y="210" width="160" height="220" rx="16" fill="#ffffff"/>
    <rect x="220" y="210" width="160" height="42" rx="16" fill="#0284c7"/>
    <text x="300" y="238" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">KISANPRO</text>

    <text x="300" y="280" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#0284c7" text-anchor="middle">16L KNAPSACK</text>
